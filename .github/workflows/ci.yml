# Every push and pull request: the protocol tests and the host preview under AddressSanitizer and
# UndefinedBehaviorSanitizer, the firmware build, and a size limit (the image must leave room in its OTA slot).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protocol tests (ASan + UBSan)
        run: |
          cmake -S components/nano_protocol/test -B build/test \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
          cmake --build build/test
          ./build/test/test_protocol

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
      - name: Size limit (92% of the OTA slot)
        shell: bash
        run: |
          python3 - <<'EOF'
          import os, sys
          slot = next(int(row.split(',')[4], 0) for row in open('partitions.csv') if row.startswith('ota_0'))
          size = os.path.getsize('build/nanogig_screen.bin')
          print(f'image {size} bytes, slot {slot} bytes: {100 * size / slot:.1f}%')
          sys.exit(0 if size <= slot * 0.92 else 'image above 92% of the OTA slot')
          EOF
      # The preview builds LVGL from managed_components, which the firmware build has just fetched.
      - name: Host preview (ASan + UBSan)
        shell: bash
        run: |
          command -v gcc >/dev/null || { apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev; }
          cmake -S tools/preview -B build/preview \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
          cmake --build build/preview -j"$(nproc)"
          ASAN_OPTIONS=detect_leaks=0 ./build/preview/preview build/preview-out
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: build/preview-out/*.png
